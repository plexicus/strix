name: build-deploy Strix (GAR)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - uat
      - dev
      - standalone
      - "feat/**"
    paths:
      - "strix/**"
      - "containers/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/build-strix.yml"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
    steps:
      - name: Set target environment
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
            echo "env_name=prod" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == 'refs/heads/uat' ]]; then
            echo "env_name=uat" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == 'refs/heads/dev' ]]; then
            echo "env_name=dev" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == 'refs/heads/standalone' ]]; then
            echo "env_name=standalone" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=dev" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ needs.setup.outputs.env_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GAR_SERVICE_ACCOUNT_KEY }}

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker ${{ vars.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image to GCP Artifact Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GAR_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/strix:1.0.${{ github.run_number }}
            ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GAR_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/strix:latest
